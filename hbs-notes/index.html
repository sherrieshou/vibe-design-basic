<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Three Technologies that Will Change the World — 2026 Fall HBS Notes">
  <title>Three Technologies that Will Change the World</title>
  <link rel="stylesheet" href="../component-repo/css/style.css">
  <style>
    .empty-notes {
      min-height: 62vh;
      display: block;
    }

    .notes-index-hero {
      min-height: 0;
      grid-template-columns: 1fr;
    }

    .home-link {
      color: inherit;
      text-decoration: none;
    }

    .home-link:hover,
    .home-link:focus-visible {
      color: var(--accent);
      outline: 0;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .note-card {
      display: block;
      padding: 24px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color .16s ease, transform .16s ease, background-color .16s ease;
    }

    a.note-card:hover,
    a.note-card:focus-visible {
      border-color: var(--accent);
      background: #fff;
      outline: 0;
      transform: translateY(-2px);
    }

    .note-card h2 {
      display: block;
      margin: 0;
      font: 700 clamp(24px, 2.4vw, 38px)/1.08 var(--mono);
      letter-spacing: -.045em;
    }

    .note-card h2::before {
      content: none;
    }

    .note-card p {
      margin: 18px 0 0;
      color: var(--muted);
      font: 13px/1.4 var(--mono);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .notes-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div class="utility-bar">
        <div class="utility-left">
          <span class="index-chip">#03</span>
          <a class="home-link" href="../index.html">Vibe Design Basic</a>
        </div>
        <div class="utility-right"><span class="status-dot"></span><span>2026 Fall HBS Notes</span></div>
      </div>
      <div class="hero notes-index-hero">
        <div class="hero-copy">
          <p class="eyebrow">HBS / FALL 2026</p>
          <h1><span>Three Technologies<br>that Will Change<br>the World</span></h1>
        </div>
      </div>
    </header>

    <div class="layout empty-notes">
      <main>
        <article class="doc-content" aria-label="HBS Notes 内容">
          <div class="notes-grid">
            <a class="note-card" href="three-technologies/index.html">
              <h2>Alpha Go</h2>
              <p>September 3, 2026</p>
            </a>
            <a class="note-card" href="ant-group-alibaba/index.html">
              <h2>Ant Group × Alibaba</h2>
              <p>September 8, 2026</p>
            </a>
            <a class="note-card" href="anthropic/index.html">
              <h2>Anthropic</h2>
              <p>September 9, 2026</p>
            </a>
          </div>
        </article>
      </main>
    </div>
  </div>
</body>
</html>
