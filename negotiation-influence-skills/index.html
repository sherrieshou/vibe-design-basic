  <style>
    .home-link { color: inherit; text-decoration: none; }
    .home-link:hover, .home-link:focus-visible { color: var(--accent); outline: 0; }
    .notes-index-hero { min-height: 0; grid-template-columns: 1fr; }
    .notes-layout { min-height: 62vh; display: block; }
    .notes-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .note-card { display: block; padding: 24px; border: 1px solid var(--line-strong); background: var(--surface); color: inherit; text-decoration: none; transition: border-color .16s ease, transform .16s ease, background-color .16s ease; }
    .note-card:hover, .note-card:focus-visible { border-color: var(--accent); background: #fff; outline: 0; transform: translateY(-2px); }
    .note-card h2 { display: block; margin: 0; font: 700 clamp(24px, 2.4vw, 38px)/1.08 var(--mono); letter-spacing: -.045em; }
    .note-card h2::before { content: none; }
    .note-card p { margin: 18px 0 0; color: var(--muted); font: 13px/1.4 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
    @media (max-width: 900px) { .notes-grid { grid-template-columns: 1fr; } }
  </style>
